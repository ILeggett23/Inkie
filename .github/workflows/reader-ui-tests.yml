name: Reader UI and refresh regressions
on:
  push:
    branches: [fix/ui-input-refresh]
  pull_request:
    paths: ['reader/**', '.github/workflows/reader-ui-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: release
            cacheFlavor: ''
            sanitizer: ''
          - label: asan-ubsan
            cacheFlavor: asan-ubsan
            sanitizer: 'address,undefined'
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ci-ccache
      CCACHE_MAXSIZE: 512M
      CCACHE_COMPILERCHECK: content
      QT_QPA_PLATFORM: offscreen
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build libsystemd-dev libssl-dev libgl1-mesa-dev libxkbcommon-dev zlib1g-dev
      - name: Exact Qt version for host tests
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.8.2'
          arch: linux_gcc_64
          cache: true
      - name: Restore pinned MuPDF host build
        id: mupdf-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-deps/mupdf-host
          key: mupdf-1.28.3-37c3209d-ubuntu2404-${{ runner.arch }}-${{ hashFiles('reader/tools/build-reader-mupdf.sh') }}
      - name: Recover pinned dependency source without a VM or recovery key
        if: steps.mupdf-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .ci-deps
          gh release download linux-ci-dependency-source-20261016 --repo "$GITHUB_REPOSITORY" --pattern mupdf-1.28.3-source.tar.gz --dir .ci-deps
          echo '37c3209dc0e06fa4f3781ed44839ad933a9e6143eb4731f99e069204715bcef2  .ci-deps/mupdf-1.28.3-source.tar.gz' | sha256sum -c -
          tar -xzf .ci-deps/mupdf-1.28.3-source.tar.gz -C .ci-deps
          bash reader/tools/build-reader-mupdf.sh "$PWD/.ci-deps/mupdf-1.28.3-source" "$PWD/.ci-deps/mupdf-host" host
      - name: Save verified MuPDF host build before application checks
        if: steps.mupdf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-deps/mupdf-host
          key: ${{ steps.mupdf-cache.outputs.cache-primary-key }}
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-ccache
          key: reader-qt682-mupdf1283-ubuntu2404-${{ runner.arch }}-${{ matrix.cacheFlavor }}-${{ github.sha }}
          restore-keys: |
            reader-qt682-mupdf1283-ubuntu2404-${{ runner.arch }}-${{ matrix.cacheFlavor }}-
      - name: Build changed production paths and regression executables
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          ci_cmake_args=()
          if [ -n "$SANITIZER" ]; then ci_cmake_args+=('-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O1 -g1 -DNDEBUG'); fi
          cmake -S reader -B .ci-build -G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=ccache "${ci_cmake_args[@]}" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_VENDOR_RUNTIME=ON -DSPIKE_SANITIZER="$SANITIZER" -DMUPDF_INCLUDE="$PWD/.ci-deps/mupdf-host/source/include" -DMUPDF_ARCHIVES="$PWD/.ci-deps/mupdf-host/lib/libmupdf.a;$PWD/.ci-deps/mupdf-host/lib/libmupdf-third.a"
          cmake --build .ci-build --parallel 2 --target sand-transition-tests sand-route-tests reveal-route-tests sustained-session-tests ui-damage-tests eink-refresh-tests ib-layout-tests ib-surface-tests ib-preview status-screen-tests
          .ci-build/sand-transition-tests "$PWD/.ci-sand-stages"
          .ci-build/sustained-session-tests
          .ci-build/ui-damage-tests
          .ci-build/eink-refresh-tests
          .ci-build/ib-layout-tests "$PWD/reader"
          .ci-build/status-screen-tests "$PWD/reader"
          .ci-build/ib-surface-tests "$PWD/reader"
          # A moved, resized or lost control shows up here: regenerate the baseline deliberately with
          # ib-preview reader <dir> --targets when a layout change is intended.
          .ci-build/ib-preview "$PWD/reader" "$PWD/.ci-targets" --targets
          diff -u reader/tests/fixtures/ib-targets.txt .ci-targets/targets.txt
          cmake --build .ci-build --parallel 2 --target styled-integration-tests styled-publication-tests tom-reply-ink-tests tom-panel-tests notes-foundation-tests ux-behavior-tests selection-route-tests semantic-tests reader-experience1-prepare refresh-extent-tests semantic-range-tests tom-auto-reply-tests companion-client-tests picture-panel-tests tom-runtime-tests receiver-interactive-tests
          cmake --build .ci-build --parallel 2 --target library-view-tests library-manage-tests companion-view-tests wifi-tests timezone-view-tests tools-view-tests document-controls-tests tom-inline-panel-tests semantic-crop-tests user-messages-tests library-route-tests notes-route-tests status-route-tests timezone-route-tests gesture-route-tests
      - name: Native Linux fixture loader
        run: |
          mkdir -p .ci-sysroot/usr/lib
          ln -s /lib64/ld-linux-x86-64.so.2 .ci-sysroot/usr/lib/ld-linux-aarch64.so.1
          python3 - <<'PY'
          from pathlib import Path
          import os
          lib = Path(os.environ['QT_ROOT_DIR']) / 'lib'
          dest = Path('.ci-sysroot/usr/lib')
          for p in lib.glob('*.so*'):
              (dest / p.name).symlink_to(p.resolve())
          PY
      - name: Run production-path tests with simulated input and vendor boundaries
        run: |
          set -euo pipefail
          .ci-build/sustained-session-tests
          .ci-build/ui-damage-tests
          .ci-build/eink-refresh-tests
          .ci-build/receiver-interactive-tests
          .ci-build/refresh-extent-tests
          .ci-build/semantic-range-tests
          .ci-build/tom-auto-reply-tests
          .ci-build/companion-client-tests
          .ci-build/picture-panel-tests "$PWD/reader"
          .ci-build/tom-runtime-tests "$PWD/.ci-sysroot"
          .ci-build/styled-integration-tests
          .ci-build/styled-publication-tests
          .ci-build/tom-reply-ink-tests
          .ci-build/tom-panel-tests
          .ci-build/notes-foundation-tests "$PWD/reader" "$PWD/.ci-sysroot"
          .ci-build/semantic-tests "$PWD/reader" "$PWD/.ci-test-data/semantic" "$PWD/.ci-build" "$PWD/.ci-sysroot"
          .ci-build/selection-route-tests "$PWD/reader" "$PWD/.ci-test-data/selection" "$PWD/.ci-build" "$PWD/.ci-sysroot"
          .ci-build/ux-behavior-tests "$PWD/reader" "$PWD/.ci-test-data/ux" "$PWD/.ci-build" "$PWD/.ci-sysroot"
          .ci-build/sand-route-tests "$PWD/reader" "$PWD/.ci-test-data/sand-route" "$PWD/.ci-build" "$PWD/.ci-sysroot"
          .ci-build/reveal-route-tests "$PWD/reader" "$PWD/.ci-test-data/legacy-reveal-route" "$PWD/.ci-build" "$PWD/.ci-sysroot"
          echo 'Linux host regressions only; tablet ABI, optical behavior and live providers are not qualified.'
      - name: Run view and shell-route tests (previously local-only)
        run: |
          set -euo pipefail
          .ci-build/library-view-tests
          .ci-build/library-manage-tests
          .ci-build/companion-view-tests
          .ci-build/wifi-tests
          .ci-build/timezone-view-tests "$PWD/reader"
          .ci-build/tools-view-tests
          .ci-build/document-controls-tests
          .ci-build/tom-inline-panel-tests "$PWD/reader"
          .ci-build/semantic-crop-tests
          .ci-build/user-messages-tests
          for t in library notes status timezone gesture; do
            .ci-build/$t-route-tests "$PWD/reader" "$PWD/.ci-test-data/$t-route" "$PWD/.ci-build" "$PWD/.ci-sysroot"
          done
      - name: Run store, stream, page-view and touch tests (previously local-only)
        run: |
          set -euo pipefail
          # Inkie's conversation store and memory, its event stream, PDF view planning and turned (landscape)
          # pages, prepared-page storage, touch gestures, and EPUB layouts with their turned pages (docs/LANDSCAPE.md).
          cmake --build .ci-build --parallel 2 --target tom-store-tests tom-session-tests touch-drag-tests pdf-viewport-tests prepare-document-view-tests epub-view-store-tests prepare-epub-view-tests epub-view-route-tests
          .ci-build/tom-store-tests
          .ci-build/tom-session-tests
          .ci-build/touch-drag-tests
          .ci-build/pdf-viewport-tests "$PWD/reader/fixtures/library/authored-three-pages.pdf"
          .ci-build/prepare-document-view-tests "$PWD/reader"
          .ci-build/epub-view-store-tests
          .ci-build/prepare-epub-view-tests "$PWD/reader"
          .ci-build/epub-view-route-tests "$PWD/reader" "$PWD/.ci-test-data/epub-view-route" "$PWD/.ci-build" "$PWD/.ci-sysroot"
      - name: Render host previews of every kit surface
        run: |
          set -euo pipefail
          .ci-build/ib-preview "$PWD/reader" "$PWD/.ci-previews"
          echo 'Painter-level previews: no shell compositing, refresh scheduling or panel optics.'
      - name: Preserve host previews
        if: matrix.label == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inkbound-host-previews
          path: |
            .ci-previews/
            .ci-sand-stages/
            .ci-test-data/sand-route/sand-captures/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve compiler cache after success or failure
        if: always() && !cancelled()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  companion-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: companion/cloudflare/package-lock.json
      - name: Isolated converter test environment
        run: |
          python3 -m venv companion/.venv
          companion/.venv/bin/python -m pip install -r companion/requirements.txt
      - name: Locked Worker runtime dependencies
        working-directory: companion/cloudflare
        run: npm ci
      - name: Worker contract and real isolated runtime checks
        working-directory: companion/cloudflare
        run: npm test
      - name: Compile deployable Worker bundle without deployment
        working-directory: companion/cloudflare
        run: npm run build
      - name: Preserve reviewed Companion bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: companion-qol-bundle
          path: companion/cloudflare/work/scene-build/
          retention-days: 7
          if-no-files-found: error
